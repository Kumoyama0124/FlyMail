name: FlyMail
options:
  bundleIdPrefix: com.gymbull
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""          # 在 Xcode 中设置你的 Team
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.2"      # 对外版本号（关于页显示的 V1.2）
    CURRENT_PROJECT_VERSION: 4    # 构建号，每次发版 +1
targets:
  FlyMail:
    type: application
    platform: iOS
    sources: [FlyMail]
    info:
      path: FlyMail/Resources/Info.plist
      properties:
        CFBundleDisplayName: FlyMail
        CFBundleShortVersionString: "1.2"
        CFBundleVersion: "4"
        UILaunchScreen: {}
        UISupportsDocumentBrowser: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch, processing, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.gymbull.flymail.refresh, com.gymbull.flymail.outbox]
        CFBundleURLTypes:
          - CFBundleURLSchemes: [com.gymbull.flymail, msauth.com.gymbull.flymail, com.googleusercontent.apps.YOUR_GOOGLE_IOS_CLIENT_ID]
        FMGoogleClientID: "YOUR_GOOGLE_IOS_CLIENT_ID.apps.googleusercontent.com"
        FMMicrosoftClientID: "YOUR_MICROSOFT_APP_CLIENT_ID"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gymbull.flymail
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: FlyMail/Resources/FlyMail.entitlements
